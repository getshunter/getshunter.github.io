# Generated by Shunter. Installs pinned shunt runner 0.2.4.1107 including its Python runtime; no Qt or compiler required.
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - bash: |
      set -eu
      mkdir -p .shunter
      export SHUNTER_REPOSITORY=getshunter/shunter
      curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/getshunter/shunter-action/main/install.sh' -o .shunter/install.sh
      runner="$(sh .shunter/install.sh '0.2.4.1107')"
      status=0
      "$runner" 'tinyxml2.flowbook' --flow 'test' --html-log .shunter/report.html --ci azure --ci-defer-summary || status=$?
      if [ -f .shunter/report.md ]; then
        report_url="${SYSTEM_TEAMFOUNDATIONCOLLECTIONURI}_apis/resources/Containers/${BUILD_CONTAINERID}?itemPath=flow%2Freport.html&scope=${SYSTEM_TEAMPROJECTID}&%24format=octetStream&api-version=4.1-preview.4"
        printf 'Open Shunter log: %s\n' "$report_url"
        "$runner" --publish-summary .shunter/report.md --report-url "$report_url" --ci azure
      fi
      exit "$status"
    displayName: Run Flow
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    displayName: Publish Shunter test results
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: .shunter/artifacts/**/*.xml
      mergeTestResults: true
      failTaskOnFailedTests: false
      failTaskOnMissingResultsFile: false
# Shunt uses the Azure agent's native artifact and Markdown-summary commands.
