# Generated by Shunter. Installs pinned shunt runner 0.2.4.1107 including its Python runtime; no Qt or compiler required.
# Replace PROJECT and FLOW with your Bamboo project and plan keys. Import through Bamboo Specs.
version: 2
plan:
  project-key: PROJECT
  key: FLOW
  name: Shunter
stages:
  - Run:
      jobs:
        - Flow job
Flow job:
  key: RUN
  tasks:
    - checkout: {force-clean-build: false}
    - script:
        interpreter: SHELL
        scripts:
          - |
            #!/bin/sh
            set -eu
            mkdir -p .shunter
            export SHUNTER_REPOSITORY=getshunter/shunter
            curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/getshunter/shunter-action/main/install.sh' -o .shunter/install.sh
            runner="$(sh .shunter/install.sh '0.2.4.1107')"
            "$runner" 'tinyxml2.flowbook' --flow 'test' --html-log .shunter/report.html --ci bamboo
  artifacts:
    - name: Shunter Report
      location: .shunter
      pattern: 'report.*'
      shared: false
      required: false
    - name: Shunter Artifacts
      location: .shunter/artifacts
      pattern: '**'
      shared: false
      required: false
