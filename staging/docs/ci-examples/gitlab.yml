# Generated by Shunter. Installs pinned shunt runner 0.2.4.1107 including its Python runtime; no Qt or compiler required.
flow:
  script:
    - |
      set -eu
      mkdir -p .shunter
      export SHUNTER_REPOSITORY=getshunter/shunter
      curl --fail --location --retry 3 --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/getshunter/shunter-action/main/install.sh' -o .shunter/install.sh
      runner="$(sh .shunter/install.sh '0.2.4.1107')"
      status=0
      "$runner" 'tinyxml2.flowbook' --flow 'test' --html-log .shunter/report.html --ci gitlab || status=$?
      if [ -f .shunter/report.html ] && [ -n "${CI_JOB_URL:-}" ]; then
        report_url="$CI_JOB_URL/artifacts/file/.shunter/report.html"
        if printf '%s\n' "$CI_JOB_URL" | grep -Eq '^https://gitlab\.com/[A-Za-z0-9][A-Za-z0-9-]{0,62}/([A-Za-z0-9_.-]+/)+-/jobs/[0-9]+$'; then
          job="${CI_JOB_URL#https://gitlab.com/}"
          namespace="$(printf '%s' "${job%%/*}" | tr '[:upper:]' '[:lower:]')"
          report_url="https://$namespace.gitlab.io/-/${job#*/}/artifacts/.shunter/report.html"
        fi
        printf '{"shunter":[{"external_link":{"label":"Open Shunter log","url":"%s"}}]}\n' "$report_url" > .shunter/report-links.json
      fi
      exit "$status"
  artifacts:
    when: always
    expose_as: 'Flow report'
    paths:
      - .shunter/report.html
      - .shunter/report.json
      - .shunter/report.md
      - .shunter/report-links.json
      - .shunter/artifacts/
    reports:
      annotations: .shunter/report-links.json
      junit: .shunter/artifacts/**/*.xml
