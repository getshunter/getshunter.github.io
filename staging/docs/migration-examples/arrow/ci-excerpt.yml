# Excerpt from https://github.com/apache/arrow/blob/aea1a8bd0c8de8da0c864dad53af589e93abec6b/.github/workflows/cpp.yml and .github/workflows/python.yml
# Pinned commit: aea1a8bd0c8de8da0c864dad53af589e93abec6b
