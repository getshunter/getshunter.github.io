jobs:
  linux-cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: archery docker run conda-cpp
  linux-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test PyArrow
        run: archery docker run python
