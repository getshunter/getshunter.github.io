# Generated by Shunter. Installs pinned shunt runner 0.2.4.1107 including its Python runtime; no Qt or compiler required.
name: Shunter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  flow:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This sample has no external project dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Shunter
        uses: getshunter/shunter-action@v1
        with:
          version: '0.2.4.1107'
          file: 'node.flowbook'
          flow: 'main'
          report: .shunter/report.html
