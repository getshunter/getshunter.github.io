name: TinyXML2 test matrix
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        cmake: ['3.15', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v4
      - uses: jwlawson/actions-setup-cmake@v2
