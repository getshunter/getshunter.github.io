# Generated by Shunter. Installs pinned shunt runner 0.2.4.1107 including its Python runtime; no Qt or compiler required.
name: Shunter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  flow:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Project dependencies: add your setup steps here, or provision them in the Flow.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project checks
        run: python -m pip install pytest ruff
      - name: Run Shunter
        uses: getshunter/shunter-action@v1
        with:
          version: '0.2.4.1107'
          file: 'python.flowbook'
          flow: 'main'
          report: .shunter/report.html
