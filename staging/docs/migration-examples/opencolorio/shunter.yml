# Generated by Shunter. Installs pinned shunt runner 0.2.4.1107 including its Python runtime; no Qt or compiler required.
name: Shunter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  flow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cy2023-debug-shared, cy2023-release-shared, cy2023-release-static, cy2024-debug-shared, cy2024-release-shared, cy2024-release-static, cy2025-debug-shared, cy2025-release-shared, cy2025-release-static, cy2026-debug-shared, cy2026-release-shared, cy2026-release-static]
    steps:
      - uses: actions/checkout@v7
      # Project dependencies: add your setup steps here, or provision them in the Flow.
      - name: Run Shunter
        uses: getshunter/shunter-action@v1
        with:
          version: '0.2.4.1107'
          file: 'opencolorio.flowbook'
          flow: 'main'
          variables: |
            BuildVariant=${{ matrix.variant }}
          report: .shunter/report.html
